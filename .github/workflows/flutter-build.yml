name: Flutter CI

on:
  push:
    branches: [ "use_html" ]
  pull_request:
    branches: [ "use_html" ]
  release:
    types: [created]
  # 手动触发选项
  workflow_dispatch:
    inputs:
      clear_cache:
        description: '清除缓存并强制重新构建'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便调试
      
      - name: Check code version
        run: |
          echo "当前提交: $(git rev-parse HEAD)"
          echo "最近5次提交:"
          git log -n 5 --oneline
          echo "修改的文件:"
          git diff --name-only HEAD~1 HEAD
      
      # 暂时禁用缓存以避免版本冲突问题
      # - name: Cache Gradle dependencies
      #   if: ${{ github.event.inputs.clear_cache != 'true' }}
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches/modules-2
      #       ~/.gradle/caches/jars-*
      #       ~/.gradle/wrapper/dists
      #     key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-deps-
      
      # 暂时禁用缓存以避免版本冲突问题  
      # - name: Cache Flutter dependencies
      #   if: ${{ github.event.inputs.clear_cache != 'true' }}
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.pub-cache
      #     key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
      #     restore-keys: |
      #       ${{ runner.os }}-flutter-deps-

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: ${{ github.event.inputs.clear_cache != 'true' }}

      - name: Decode Keystore
        run: |
          echo "开始处理密钥文件..."
          echo "检查目标目录是否存在..."
          mkdir -p android/app
          echo "目标目录创建完成"
          
          echo "解码并保存密钥文件..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          
          echo "验证密钥文件..."
          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "密钥文件已成功创建"
            ls -l android/app/upload-keystore.jks
          else
            echo "错误：密钥文件未创建成功"
            exit 1
          fi
          
          echo "创建key.properties文件..."
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/upload-keystore.jks
          EOF
          
          echo "检查key.properties文件..."
          if [ -f "android/key.properties" ]; then
            echo "key.properties文件存在"
            echo "验证密钥文件路径..."
            cat android/key.properties | grep -v "password" | grep -v "alias"
          else
            echo "错误：key.properties文件不存在"
            exit 1
          fi

      - name: Check Environment
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Dart version:"
          dart --version
          echo "Java version:"
          java -version
          echo "Workspace directory:"
          pwd
          echo "Directory contents:"
          ls -la
      - name: Clear all caches to avoid version conflicts  
        run: |
          echo "🧹 清理所有缓存以避免版本冲突"
          
          # 清理 Flutter 和 Dart 缓存
          flutter clean || true
          dart pub cache clean --force || true
          
          # 清理 pub-cache 中的问题包
          rm -rf $HOME/.pub-cache/hosted/pub.dev/isar*
          rm -rf $HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview*
          rm -rf $HOME/.pub-cache/hosted/pub.dev/webview_flutter*
          
          # 清理所有编译产物
          rm -rf build/
          rm -rf android/.gradle/
          rm -rf android/app/build/
          rm -rf .dart_tool/
          
          # 删除 pubspec.lock 强制重新解析依赖
          rm -f pubspec.lock
          
          echo "✅ 缓存清理完成"
          
      - name: Install dependencies with clean resolution
        run: |
          echo "📦 重新安装依赖"
          flutter pub get --no-example
          
          echo "📋 检查安装的 Isar 版本:"
          flutter pub deps | grep isar || true
        
      - name: Fix Isar namespace issue
        run: |
          echo "🔧 修复 Isar Flutter Libs namespace 问题"
          
          # 定义要修复的版本列表
          VERSIONS_TO_FIX=(
            "3.0.5"
            "3.1.0+1"
            "3.1.0"
          )
          
          FIXED_COUNT=0
          
          for VERSION in "${VERSIONS_TO_FIX[@]}"; do
            ISAR_BUILD_FILE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-${VERSION}/android/build.gradle"
            echo "🔍 检查版本 ${VERSION}: $ISAR_BUILD_FILE"
            
            if [ -f "$ISAR_BUILD_FILE" ]; then
              echo "✅ 找到版本 ${VERSION} 的 build.gradle 文件"
              
              # 检查是否已经有 namespace
              HAS_NAMESPACE=$(grep -q "namespace" "$ISAR_BUILD_FILE" && echo "true" || echo "false")
              
              if [ "$HAS_NAMESPACE" = "false" ]; then
                echo "🔄 为版本 ${VERSION} 添加 namespace"
                # 备份原文件
                cp "$ISAR_BUILD_FILE" "$ISAR_BUILD_FILE.backup"
                
                # 在 "android {" 行后添加 namespace
                sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_BUILD_FILE"
                
                # 验证修复是否成功
                if grep -q "namespace" "$ISAR_BUILD_FILE"; then
                  echo "✅ 版本 ${VERSION} namespace 修复完成"
                  FIXED_COUNT=$((FIXED_COUNT + 1))
                  
                  # 显示修复后的内容
                  echo "📋 版本 ${VERSION} 修复后的 android 块:"
                  sed -n '/^android {/,/^}/p' "$ISAR_BUILD_FILE" | head -10
                else
                  echo "❌ 版本 ${VERSION} namespace 修复失败"
                fi
              else
                echo "ℹ️ 版本 ${VERSION} 的 namespace 已存在"
              fi
              
              # 无论是否有 namespace，都检查并修复 SDK 版本
              if grep -q "compileSdkVersion 30" "$ISAR_BUILD_FILE"; then
                echo "🔄 为版本 ${VERSION} 升级 SDK 版本从 30 到 35"
                sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$ISAR_BUILD_FILE"
                echo "✅ 版本 ${VERSION} SDK 版本已升级到 35"
                FIXED_COUNT=$((FIXED_COUNT + 1))
              elif grep -q "compileSdkVersion 35" "$ISAR_BUILD_FILE"; then
                echo "ℹ️ 版本 ${VERSION} 已使用 SDK 35"
              else
                echo "⚠️ 版本 ${VERSION} 使用未知的 SDK 版本"
                grep "compileSdkVersion" "$ISAR_BUILD_FILE" || echo "   (未找到 compileSdkVersion)"
              fi
            else
              echo "⚠️ 版本 ${VERSION} 的文件不存在: $ISAR_BUILD_FILE"
            fi
          done
          
          echo "📊 修复摘要:"
          echo "   - 修复的文件数量: $FIXED_COUNT"
          
          # 搜索所有实际存在的 isar_flutter_libs 版本
          echo "🔍 搜索所有 isar_flutter_libs 版本:"
          ALL_ISAR_DIRS=$(find $HOME/.pub-cache/hosted/pub.dev/ -name "isar_flutter_libs-*" -type d 2>/dev/null | sort || true)
          
          if [ -z "$ALL_ISAR_DIRS" ]; then
            echo "⚠️ 未找到任何 isar_flutter_libs 目录"
          else
            echo "📁 找到的所有版本:"
            for DIR in $ALL_ISAR_DIRS; do
              VERSION_DIR=$(basename "$DIR")
              BUILD_FILE="$DIR/android/build.gradle"
              if [ -f "$BUILD_FILE" ]; then
                if grep -q "namespace" "$BUILD_FILE"; then
                  echo "   ✅ $VERSION_DIR (已有 namespace)"
                else
                  echo "   ❌ $VERSION_DIR (缺少 namespace)"
                  
                  # 动态修复未知版本
                  echo "🔄 动态修复 $VERSION_DIR"
                  cp "$BUILD_FILE" "$BUILD_FILE.backup"
                  sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$BUILD_FILE"
                  
                  if grep -q "namespace" "$BUILD_FILE"; then
                    echo "   ✅ $VERSION_DIR 动态修复成功"
                  else
                    echo "   ❌ $VERSION_DIR 动态修复失败"
                  fi
                fi
                
                # 检查并修复 SDK 版本
                if grep -q "compileSdkVersion 30" "$BUILD_FILE"; then
                  echo "🔄 动态修复 $VERSION_DIR SDK 版本"
                  sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$BUILD_FILE"
                  if grep -q "compileSdkVersion 35" "$BUILD_FILE"; then
                    echo "   ✅ $VERSION_DIR SDK 版本修复成功"
                  else
                    echo "   ❌ $VERSION_DIR SDK 版本修复失败"
                  fi
                fi
              else
                echo "   ⚠️ $VERSION_DIR (无 build.gradle)"
              fi
            done
          fi
          
      - name: Fix Android SDK compatibility issues
        run: |
          echo "🔧 修复 Android SDK 兼容性问题"
          
          # 检查并修复项目的 build.gradle（支持 .gradle 和 .kts）
          APP_BUILD_GRADLE="android/app/build.gradle"
          APP_BUILD_GRADLE_KTS="android/app/build.gradle.kts"
          
          if [ -f "$APP_BUILD_GRADLE_KTS" ]; then
            echo "📋 当前 app/build.gradle.kts 配置:"
            grep -E "(compileSdk|targetSdk|minSdk)" "$APP_BUILD_GRADLE_KTS" || true
          elif [ -f "$APP_BUILD_GRADLE" ]; then
            echo "📋 当前 app/build.gradle 配置:"
            grep -E "(compileSdkVersion|targetSdkVersion|minSdkVersion)" "$APP_BUILD_GRADLE" || true
            
            # 确保使用统一的 SDK 版本
            echo "🔄 确保 Android SDK 版本一致性"
            
            # 检查 Isar 是否设置了正确的 compileSdkVersion
            ALL_ISAR_DIRS=$(find $HOME/.pub-cache/hosted/pub.dev/ -name "isar_flutter_libs-*" -type d 2>/dev/null | sort || true)
            for DIR in $ALL_ISAR_DIRS; do
              ISAR_BUILD_FILE="$DIR/android/build.gradle"
              if [ -f "$ISAR_BUILD_FILE" ]; then
                echo "📋 检查 $(basename $DIR) 的 SDK 版本:"
                grep -E "(compileSdkVersion|minSdkVersion)" "$ISAR_BUILD_FILE" || true
                
                # 如果 Isar 使用的是 SDK 30，升级到 35 以匹配项目配置
                if grep -q "compileSdkVersion 30" "$ISAR_BUILD_FILE"; then
                  echo "⚠️ Isar 使用 SDK 30，升级到 35"
                  # 将 Isar 的 compileSdkVersion 升级到 35
                  sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$ISAR_BUILD_FILE"
                  echo "✅ 已将 Isar SDK 版本升级到 35"
                fi
              fi
            done
          else
            echo "⚠️ 未找到 app/build.gradle 文件"
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        
      #- name: Analyze project source
      #  run: flutter analyze --no-fatal-warnings
        
      # 强制清理编译产物，确保使用最新代码
      - name: Clean before build
        run: flutter clean
              
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: List APK files
        run: ls -l build/app/outputs/flutter-apk/

      - name: Rename APK with version
        run: |
          cd build/app/outputs/flutter-apk/
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv "app-arm64-v8a-release.apk" "app-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          fi

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-${{ steps.version.outputs.version }}-arm64-v8a.apk
          
      - name: Upload Artifact for Debug
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: build/app/outputs/flutter-apk/app-${{ steps.version.outputs.version }}-arm64-v8a.apk
          retention-days: 7

      # 自动推送APK到仓库，方便Android用户直接下载最新版本
      - name: Setup releases directory
        run: |
          mkdir -p .github/releases
          echo "✅ 创建releases目录"

      - name: Copy APK with fixed name
        run: |
          # 复制APK并使用固定文件名
          cp build/app/outputs/flutter-apk/app-${{ steps.version.outputs.version }}-arm64-v8a.apk .github/releases/mika-app-latest.apk
          echo "✅ APK已复制为固定文件名: mika-app-latest.apk"
          
          # 生成版本信息JSON
          cat > .github/releases/version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "build_time": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "download_url": "https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/.github/releases/mika-app-latest.apk"
          }
          EOF
          echo "✅ 版本信息文件已生成"
          
          # 显示文件信息
          ls -lh .github/releases/
          echo "📱 APK文件大小: $(du -h .github/releases/mika-app-latest.apk | cut -f1)"

      - name: Commit and push APK to repository
        run: |
          # 配置Git用户信息
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 精确添加指定文件（即使被gitignore忽略）
          git add --force .github/releases/mika-app-latest.apk
          git add .github/releases/version.json
          git add .github/releases/README.md
          
          # 检查是否有变更，避免空提交
          if git diff --staged --quiet; then
            echo "ℹ️ 没有检测到文件变更，跳过提交"
          else
            # 提交变更
            git commit -m "🚀 Auto-update APK to v${{ steps.version.outputs.version }}

          📱 Version: ${{ steps.version.outputs.version }}
          🔗 Download: https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/.github/releases/mika-app-latest.apk
          ⏰ Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            
            # 推送到远程仓库
            git push
            echo "✅ APK已成功推送到仓库"
            echo ""
            echo "🔗 固定下载链接:"
            echo "   https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/.github/releases/mika-app-latest.apk"
            echo ""
            echo "📋 版本信息API:"
            echo "   https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/.github/releases/version.json"
          fi
