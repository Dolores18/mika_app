name: Flutter CI

on:
  push:
    branches: [ "use_html" ]
  pull_request:
    branches: [ "use_html" ]
  release:
    types: [created]
  # 手动触发选项
  workflow_dispatch:
    inputs:
      clear_cache:
        description: '清除缓存并强制重新构建'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便调试
      
      - name: Check code version
        run: |
          echo "当前提交: $(git rev-parse HEAD)"
          echo "最近5次提交:"
          git log -n 5 --oneline
          echo "修改的文件:"
          git diff --name-only HEAD~1 HEAD
      
      - name: Cache Gradle dependencies
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-
      
      - name: Cache Flutter dependencies
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          echo "开始处理密钥文件..."
          echo "检查目标目录是否存在..."
          mkdir -p android/app
          echo "目标目录创建完成"
          
          echo "解码并保存密钥文件..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          
          echo "验证密钥文件..."
          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "密钥文件已成功创建"
            ls -l android/app/upload-keystore.jks
          else
            echo "错误：密钥文件未创建成功"
            exit 1
          fi
          
          echo "创建key.properties文件..."
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/upload-keystore.jks
          EOF
          
          echo "检查key.properties文件..."
          if [ -f "android/key.properties" ]; then
            echo "key.properties文件存在"
            echo "验证密钥文件路径..."
            cat android/key.properties | grep -v "password" | grep -v "alias"
          else
            echo "错误：key.properties文件不存在"
            exit 1
          fi

      - name: Check Environment
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Dart version:"
          dart --version
          echo "Java version:"
          java -version
          echo "Workspace directory:"
          pwd
          echo "Directory contents:"
          ls -la
      - name: Install dependencies
        run: |
          echo "📦 安装依赖"
          flutter pub get --no-example
          
          echo "📋 检查安装的 Isar 版本:"
          flutter pub deps | grep isar || true
        
      - name: Fix Isar namespace issue (if needed)
        run: |
          echo "🔧 检查并修复 Isar Flutter Libs namespace 问题"
          
          # 定义要修复的版本列表
          VERSIONS_TO_FIX=(
            "3.0.5"
            "3.1.0+1"
            "3.1.0"
          )
          
          FIXED_COUNT=0
          
          for VERSION in "${VERSIONS_TO_FIX[@]}"; do
            ISAR_BUILD_FILE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-${VERSION}/android/build.gradle"
            echo "🔍 检查版本 ${VERSION}: $ISAR_BUILD_FILE"
            
            if [ -f "$ISAR_BUILD_FILE" ]; then
              echo "✅ 找到版本 ${VERSION} 的 build.gradle 文件"
              
              # 检查是否已经有 namespace
              HAS_NAMESPACE=$(grep -q "namespace" "$ISAR_BUILD_FILE" && echo "true" || echo "false")
              
              if [ "$HAS_NAMESPACE" = "false" ]; then
                echo "🔄 为版本 ${VERSION} 添加 namespace"
                # 备份原文件
                cp "$ISAR_BUILD_FILE" "$ISAR_BUILD_FILE.backup"
                
                # 在 "android {" 行后添加 namespace
                sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_BUILD_FILE"
                
                # 验证修复是否成功
                if grep -q "namespace" "$ISAR_BUILD_FILE"; then
                  echo "✅ 版本 ${VERSION} namespace 修复完成"
                  FIXED_COUNT=$((FIXED_COUNT + 1))
                  
                  # 显示修复后的内容
                  echo "📋 版本 ${VERSION} 修复后的 android 块:"
                  sed -n '/^android {/,/^}/p' "$ISAR_BUILD_FILE" | head -10
                else
                  echo "❌ 版本 ${VERSION} namespace 修复失败"
                fi
              else
                echo "ℹ️ 版本 ${VERSION} 的 namespace 已存在"
              fi
              
              # 无论是否有 namespace，都检查并修复 SDK 版本
              if grep -q "compileSdkVersion 30" "$ISAR_BUILD_FILE"; then
                echo "🔄 为版本 ${VERSION} 升级 SDK 版本从 30 到 35"
                sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$ISAR_BUILD_FILE"
                echo "✅ 版本 ${VERSION} SDK 版本已升级到 35"
                FIXED_COUNT=$((FIXED_COUNT + 1))
              elif grep -q "compileSdkVersion 35" "$ISAR_BUILD_FILE"; then
                echo "ℹ️ 版本 ${VERSION} 已使用 SDK 35"
              else
                echo "⚠️ 版本 ${VERSION} 使用未知的 SDK 版本"
                grep "compileSdkVersion" "$ISAR_BUILD_FILE" || echo "   (未找到 compileSdkVersion)"
              fi
            else
              echo "⚠️ 版本 ${VERSION} 的文件不存在: $ISAR_BUILD_FILE"
            fi
          done
          
          echo "📊 修复摘要:"
          echo "   - 修复的文件数量: $FIXED_COUNT"
          
          # 搜索所有实际存在的 isar_flutter_libs 版本
          echo "🔍 搜索所有 isar_flutter_libs 版本:"
          ALL_ISAR_DIRS=$(find $HOME/.pub-cache/hosted/pub.dev/ -name "isar_flutter_libs-*" -type d 2>/dev/null | sort || true)
          
          if [ -z "$ALL_ISAR_DIRS" ]; then
            echo "⚠️ 未找到任何 isar_flutter_libs 目录"
          else
            echo "📁 找到的所有版本:"
            for DIR in $ALL_ISAR_DIRS; do
              VERSION_DIR=$(basename "$DIR")
              BUILD_FILE="$DIR/android/build.gradle"
              if [ -f "$BUILD_FILE" ]; then
                if grep -q "namespace" "$BUILD_FILE"; then
                  echo "   ✅ $VERSION_DIR (已有 namespace)"
                else
                  echo "   ❌ $VERSION_DIR (缺少 namespace)"
                  
                  # 动态修复未知版本
                  echo "🔄 动态修复 $VERSION_DIR"
                  cp "$BUILD_FILE" "$BUILD_FILE.backup"
                  sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$BUILD_FILE"
                  
                  if grep -q "namespace" "$BUILD_FILE"; then
                    echo "   ✅ $VERSION_DIR 动态修复成功"
                  else
                    echo "   ❌ $VERSION_DIR 动态修复失败"
                  fi
                fi
                
                # 检查并修复 SDK 版本
                if grep -q "compileSdkVersion 30" "$BUILD_FILE"; then
                  echo "🔄 动态修复 $VERSION_DIR SDK 版本"
                  sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$BUILD_FILE"
                  if grep -q "compileSdkVersion 35" "$BUILD_FILE"; then
                    echo "   ✅ $VERSION_DIR SDK 版本修复成功"
                  else
                    echo "   ❌ $VERSION_DIR SDK 版本修复失败"
                  fi
                fi
              else
                echo "   ⚠️ $VERSION_DIR (无 build.gradle)"
              fi
            done
          fi
          
      - name: Fix Android SDK compatibility issues
        run: |
          echo "🔧 修复 Android SDK 兼容性问题"
          
          # 检查并修复项目的 build.gradle（支持 .gradle 和 .kts）
          APP_BUILD_GRADLE="android/app/build.gradle"
          APP_BUILD_GRADLE_KTS="android/app/build.gradle.kts"
          
          if [ -f "$APP_BUILD_GRADLE_KTS" ]; then
            echo "📋 当前 app/build.gradle.kts 配置:"
            grep -E "(compileSdk|targetSdk|minSdk)" "$APP_BUILD_GRADLE_KTS" || true
          elif [ -f "$APP_BUILD_GRADLE" ]; then
            echo "📋 当前 app/build.gradle 配置:"
            grep -E "(compileSdkVersion|targetSdkVersion|minSdkVersion)" "$APP_BUILD_GRADLE" || true
            
            # 确保使用统一的 SDK 版本
            echo "🔄 确保 Android SDK 版本一致性"
            
            # 检查 Isar 是否设置了正确的 compileSdkVersion
            ALL_ISAR_DIRS=$(find $HOME/.pub-cache/hosted/pub.dev/ -name "isar_flutter_libs-*" -type d 2>/dev/null | sort || true)
            for DIR in $ALL_ISAR_DIRS; do
              ISAR_BUILD_FILE="$DIR/android/build.gradle"
              if [ -f "$ISAR_BUILD_FILE" ]; then
                echo "📋 检查 $(basename $DIR) 的 SDK 版本:"
                grep -E "(compileSdkVersion|minSdkVersion)" "$ISAR_BUILD_FILE" || true
                
                # 如果 Isar 使用的是 SDK 30，升级到 35 以匹配项目配置
                if grep -q "compileSdkVersion 30" "$ISAR_BUILD_FILE"; then
                  echo "⚠️ Isar 使用 SDK 30，升级到 35"
                  # 将 Isar 的 compileSdkVersion 升级到 35
                  sed -i 's/compileSdkVersion 30/compileSdkVersion 35/' "$ISAR_BUILD_FILE"
                  echo "✅ 已将 Isar SDK 版本升级到 35"
                fi
              fi
            done
          else
            echo "⚠️ 未找到 app/build.gradle 文件"
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        
      #- name: Analyze project source
      #  run: flutter analyze --no-fatal-warnings
        
      # 仅在手动清理缓存时执行清理
      - name: Clean before build
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: flutter clean
              
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Generate build identifier (not affecting APK version)
        id: version
        run: |
          # 🌟 从pubspec.yaml获取实际版本号 (保持不变)
          ACTUAL_VERSION=$(grep 'version:' pubspec.yaml | cut -d' ' -f2)
          BASE_VERSION=$(echo $ACTUAL_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $ACTUAL_VERSION | cut -d'+' -f2)
          
          # 🕐 生成时间戳用于构建标识 (仅用于文件命名和Release标识)
          TIMESTAMP=$(date -u +"%Y%m%d.%H%M")
          
          # 🔧 APK使用原始版本号，构建标识仅用于区分
          APK_VERSION="$ACTUAL_VERSION"  # 保持pubspec.yaml中的版本不变
          BUILD_IDENTIFIER="${BASE_VERSION}+${TIMESTAMP}"  # 仅用于构建标识
          
          echo "actual_version=$ACTUAL_VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VERSION" >> $GITHUB_OUTPUT
          echo "build_identifier=$BUILD_IDENTIFIER" >> $GITHUB_OUTPUT
          
          echo "📋 版本信息:"
          echo "   APK实际版本: $APK_VERSION (不变，保持覆盖安装)"
          echo "   构建标识: $BUILD_IDENTIFIER (仅用于区分构建)"
          echo "   时间戳: $TIMESTAMP"

      - name: List APK files
        run: ls -l build/app/outputs/flutter-apk/

      - name: Rename APK with build identifier
        run: |
          cd build/app/outputs/flutter-apk/
          if [ -f "app-arm64-v8a-release.apk" ]; then
            # 使用构建标识重命名文件，但APK内部版本号保持不变
            mv "app-arm64-v8a-release.apk" "app-${{ steps.version.outputs.build_identifier }}-arm64-v8a.apk"
          fi

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-${{ steps.version.outputs.build_identifier }}-arm64-v8a.apk
          
      - name: Upload Artifact for Debug
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: build/app/outputs/flutter-apk/app-${{ steps.version.outputs.build_identifier }}-arm64-v8a.apk
          retention-days: 7

      # 创建或更新GitHub Release，提供固定下载链接
      - name: Generate release info
        id: release_info
        run: |
          APK_VERSION="${{ steps.version.outputs.apk_version }}"
          BUILD_IDENTIFIER="${{ steps.version.outputs.build_identifier }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          
          # 生成版本信息JSON - 使用APK实际版本号
          cat > version.json << EOF
          {
            "version": "$APK_VERSION",
            "build_identifier": "$BUILD_IDENTIFIER",
            "build_time": "$BUILD_TIME",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/latest/mika-app-latest.apk"
          }
          EOF
          
          echo "apk_version=$APK_VERSION" >> $GITHUB_OUTPUT
          echo "build_identifier=$BUILD_IDENTIFIER" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          
          # 显示APK文件信息
          APK_FILE="build/app/outputs/flutter-apk/app-$BUILD_IDENTIFIER-arm64-v8a.apk"
          if [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            echo "📱 APK文件大小: $APK_SIZE"
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing releases
        continue-on-error: true
        run: |
          # 🗑️ 删除现有的latest release（保持兼容性）
          gh release delete latest --yes --cleanup-tag || echo "ℹ️ latest release不存在或已删除"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned release  
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.release_info.outputs.build_identifier }}"
          name: "Latest Build v${{ steps.release_info.outputs.build_identifier }}"
          body: |
            🚀 **自动构建版本** v${{ steps.release_info.outputs.build_identifier }}
            
            📱 **APK版本**: ${{ steps.release_info.outputs.apk_version }} (支持覆盖安装，保留用户数据)
            🏗️ **构建标识**: ${{ steps.release_info.outputs.build_identifier }}
            � **A交PK大小**: ${{ steps.release_info.outputs.apk_size }}
            ⏰ **构建时间**: ${{ steps.release_info.outputs.build_time }}
            🔗 **提交**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            🌿 **分支**: `${{ github.ref_name }}`
            
            ## 📥 下载
            
            - **直接下载**: [mika-app-latest.apk](https://github.com/${{ github.repository }}/releases/download/latest/mika-app-latest.apk)
            - **版本信息API**: [version.json](https://github.com/${{ github.repository }}/releases/download/latest/version.json)
            
            ## 📋 安装说明
            
            1. 下载APK文件到你的Android设备
            2. 在设置中启用"未知来源"应用安装
            3. 点击APK文件进行安装（支持直接覆盖，无需卸载）
            
            > ✅ 此版本支持覆盖安装，不会丢失用户配置和数据
            
            ---
            *此版本由GitHub Actions自动构建和发布*
          files: |
            build/app/outputs/flutter-apk/app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk
            version.json
          prerelease: false
          draft: false

      - name: Create latest alias release (for compatibility)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Build v${{ steps.release_info.outputs.build_identifier }}"
          body: |
            🔗 **这是一个别名release，指向最新构建版本**
            
            📍 **APK版本**: v${{ steps.release_info.outputs.apk_version }}
            🏗️ **构建标识**: v${{ steps.release_info.outputs.build_identifier }}
            ⏰ **构建时间**: ${{ steps.release_info.outputs.build_time }}
            
            ## 📥 下载最新版本
            
            请访问 [v${{ steps.release_info.outputs.build_identifier }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release_info.outputs.build_identifier }}) 获取完整信息
            
            - **直接下载**: [app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.release_info.outputs.build_identifier }}/app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk)
            
            > ✅ 支持覆盖安装，保留用户数据和配置
            
            ---
            *此别名release用于保持API兼容性*
          files: |
            build/app/outputs/flutter-apk/app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk
            version.json
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display download links
        run: |
          echo "✅ 双Release创建完成"
          echo ""
          echo "� AP化K版本信息:"
          echo "   实际版本: ${{ steps.release_info.outputs.apk_version }} (支持覆盖安装)"
          echo "   构建标识: ${{ steps.release_info.outputs.build_identifier }}"
          echo ""
          echo "🔗 版本化Release页面:"
          echo "   https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release_info.outputs.build_identifier }}"
          echo ""
          echo "🔗 Latest别名页面 (兼容性):"
          echo "   https://github.com/${{ github.repository }}/releases/latest"
          echo ""
          echo "� A本PK下载链接:"
          echo "   版本化: https://github.com/${{ github.repository }}/releases/download/v${{ steps.release_info.outputs.build_identifier }}/app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk"
          echo "   Latest: https://github.com/${{ github.repository }}/releases/download/latest/app-${{ steps.release_info.outputs.build_identifier }}-arm64-v8a.apk"
          echo ""
          echo "📋 版本信息API:"
          echo "   版本化: https://github.com/${{ github.repository }}/releases/download/v${{ steps.release_info.outputs.build_identifier }}/version.json"
          echo "   Latest: https://github.com/${{ github.repository }}/releases/download/latest/version.json"
          echo ""
          echo "🌟 现在支持覆盖安装，用户数据不会丢失！"
